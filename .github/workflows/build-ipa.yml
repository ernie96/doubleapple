name: Build DoubleTalk iOS IPA

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build iOS App & Extension (.ipa)
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify doubletalkpc.bin ROM
        run: |
          if [ ! -f "doubletalkpc.bin" ]; then
            echo "Error: doubletalkpc.bin missing!"
            exit 1
          fi
          echo "doubletalkpc.bin size: $(wc -c < doubletalkpc.bin) bytes"

      - name: Build DoubleTalk Package for iOS
        run: |
          swift build -c release --triple arm64-apple-ios16.0

      - name: Package Payload and Create IPA
        run: |
          mkdir -p Payload/DoubleTalkApp.app/PlugIns/DoubleTalkVoiceExtension.appex

          # Find compiled executables from SPM build
          APP_BIN=$(find .build -name "DoubleTalkApp" -type f | head -n 1)
          EXT_BIN=$(find .build -name "DoubleTalkVoiceExtension" -type f | head -n 1)

          if [ -z "$APP_BIN" ]; then
            echo "Error: DoubleTalkApp executable not found!"
            exit 1
          fi
          echo "Found main app binary at: $APP_BIN"
          echo "Found extension binary at: $EXT_BIN"

          # Assemble Main App bundle
          cp "$APP_BIN" Payload/DoubleTalkApp.app/DoubleTalkApp
          chmod +x Payload/DoubleTalkApp.app/DoubleTalkApp
          cp Apps/DoubleTalkApp/Info.plist Payload/DoubleTalkApp.app/Info.plist
          cp doubletalkpc.bin Payload/DoubleTalkApp.app/doubletalkpc.bin
          printf "APPL????" > Payload/DoubleTalkApp.app/PkgInfo

          # Assemble Voice Extension bundle
          if [ -n "$EXT_BIN" ]; then
            cp "$EXT_BIN" Payload/DoubleTalkApp.app/PlugIns/DoubleTalkVoiceExtension.appex/DoubleTalkVoiceExtension
            chmod +x Payload/DoubleTalkApp.app/PlugIns/DoubleTalkVoiceExtension.appex/DoubleTalkVoiceExtension
            cp Apps/DoubleTalkVoiceExtension/Info.plist Payload/DoubleTalkApp.app/PlugIns/DoubleTalkVoiceExtension.appex/Info.plist
            cp doubletalkpc.bin Payload/DoubleTalkApp.app/PlugIns/DoubleTalkVoiceExtension.appex/doubletalkpc.bin
          fi

          # Zip into .ipa
          zip -r DoubleTalkApp.ipa Payload
          echo "IPA successfully created: DoubleTalkApp.ipa ($(wc -c < DoubleTalkApp.ipa) bytes)"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DoubleTalkApp-iOS-IPA
          path: DoubleTalkApp.ipa
