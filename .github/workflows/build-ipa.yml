name: Build DoubleTalk iOS IPA

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build iOS App & Extension (.ipa)
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify doubletalkpc.bin ROM
        run: |
          if [ ! -f "doubletalkpc.bin" ]; then
            echo "Error: doubletalkpc.bin missing!"
            exit 1
          fi
          echo "doubletalkpc.bin size: $(wc -c < doubletalkpc.bin) bytes"

      - name: Install XcodeGen & Generate Project
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen generate

      - name: Build DoubleTalkKit Library
        run: |
          set -o pipefail
          xcodebuild \
            -project DoubleTalk.xcodeproj \
            -target DoubleTalkKit \
            -destination "generic/platform=iOS" \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            build 2>&1 | tee doubletalkkit_build.log || (echo "=== BUILD LOG FAILED ===" && cat doubletalkkit_build.log && exit 1)

      - name: Build DoubleTalkVoiceExtension
        run: |
          set -o pipefail
          xcodebuild \
            -project DoubleTalk.xcodeproj \
            -target DoubleTalkVoiceExtension \
            -destination "generic/platform=iOS" \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            build 2>&1 | tee ext_build.log || (echo "=== EXT BUILD LOG FAILED ===" && cat ext_build.log && exit 1)

      - name: Build DoubleTalkApp Application
        run: |
          set -o pipefail
          xcodebuild \
            -project DoubleTalk.xcodeproj \
            -target DoubleTalkApp \
            -destination "generic/platform=iOS" \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            build 2>&1 | tee app_build.log || (echo "=== APP BUILD LOG FAILED ===" && cat app_build.log && exit 1)

      - name: Package Payload and Create IPA
        run: |
          mkdir -p Payload
          APP_PATH=$(find build -name "DoubleTalk.app" -o -name "DoubleTalkApp.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: DoubleTalk.app not found!"
            exit 1
          fi
          echo "Found app bundle at: $APP_PATH"
          cp -R "$APP_PATH" Payload/DoubleTalkApp.app
          zip -r DoubleTalkApp.ipa Payload
          echo "IPA created successfully: DoubleTalkApp.ipa ($(wc -c < DoubleTalkApp.ipa) bytes)"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DoubleTalkApp-iOS-IPA
          path: DoubleTalkApp.ipa
