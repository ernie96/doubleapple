name: Build DoubleTalk iOS IPA

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build iOS App & Extension (.ipa)
    runs-on: macos-14
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify doubletalkpc.bin ROM
        run: |
          if [ ! -f "doubletalkpc.bin" ]; then
            echo "Error: doubletalkpc.bin missing!"
            exit 1
          fi
          echo "doubletalkpc.bin size: $(wc -c < doubletalkpc.bin) bytes"

      - name: Compile DoubleTalk C++ Emulator
        run: |
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "Using iOS SDK at: $SDK_PATH"
          {
            for file in Sources/CDoubleTalk/*.cpp Sources/CDoubleTalk/mame/*.cpp Sources/CDoubleTalk/shim/*.cpp; do
              if [ -f "$file" ]; then
                echo "Compiling $file"
                xcrun -sdk iphoneos clang++ -target arm64-apple-ios16.0 -isysroot "$SDK_PATH" -std=c++17 -c -O3 -I Sources/CDoubleTalk -I Sources/CDoubleTalk/include "$file" -o "${file%.cpp}.o"
              fi
            done
          } > cpp_build.log 2>&1 || { cat cpp_build.log; exit 1; }

      - name: Upload C++ Build Logs on Failure
        if: failure()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          cp cpp_build.log cpp_error.txt
          git add cpp_error.txt
          git commit -m "CI: cpp_error.txt" || true
          git pull --rebase origin main || true
          git push origin HEAD:main || true
      - name: Compile DoubleTalk App Binary
        run: |
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          xcrun -sdk iphoneos swiftc \
            -target arm64-apple-ios16.0 \
            -sdk "$SDK_PATH" \
            -O \
            -parse-as-library \
            -module-name DoubleTalkApp \
            -framework SwiftUI \
            -framework AVFoundation \
            -framework Foundation \
            -I Sources/CDoubleTalk/include \
            -Xcc -ISources/CDoubleTalk/include \
            -Xlinker -lc++ \
            -import-objc-header Apps/DoubleTalkApp/DoubleTalkApp-Bridging-Header.h \
            Sources/CDoubleTalk/*.o Sources/CDoubleTalk/mame/*.o Sources/CDoubleTalk/shim/*.o \
            Sources/DoubleTalkKit/DoubleTalkVoice.swift \
            Sources/DoubleTalkKit/DoubleTalkSettings.swift \
            Sources/DoubleTalkKit/DoubleTalkSettingsStore.swift \
            Sources/DoubleTalkKit/DoubleTalkSynthesizer.swift \
            Apps/DoubleTalkApp/DoubleTalkApp.swift \
            Apps/DoubleTalkApp/ContentView.swift \
            -o DoubleTalkAppExec > swiftc_app_build.log 2>&1 || (cat swiftc_app_build.log && exit 1)
          cat swiftc_app_build.log
      - name: Upload Build Logs on Failure
        if: failure()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          cp swiftc_app_build.log app_error.txt
          git add app_error.txt
          git commit -m "CI: app_error.txt" || true
          git pull --rebase origin main || true
          git push origin HEAD:main || true

      - name: Compile DoubleTalk Voice Extension Binary
        run: |
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          xcrun -sdk iphoneos swiftc \
            -target arm64-apple-ios16.0 \
            -sdk "$SDK_PATH" \
            -O \
            -parse-as-library \
            -module-name DoubleTalkVoiceExtension \
            -framework AVFoundation \
            -framework CoreMedia \
            -framework Accelerate \
            -framework Foundation \
            -framework AudioToolbox \
            -framework CoreAudio \
            -framework AudioUnit \
            -framework CoreAudioTypes \
            -I Sources/CDoubleTalk/include \
            -Xcc -ISources/CDoubleTalk/include \
            -Xlinker -lc++ \
            -import-objc-header Apps/DoubleTalkVoiceExtension/DoubleTalkVoiceExtension-Bridging-Header.h \
            Sources/CDoubleTalk/*.o Sources/CDoubleTalk/mame/*.o Sources/CDoubleTalk/shim/*.o \
            Sources/DoubleTalkKit/DoubleTalkVoice.swift \
            Sources/DoubleTalkKit/DoubleTalkSettings.swift \
            Sources/DoubleTalkKit/DoubleTalkSettingsStore.swift \
            Sources/DoubleTalkKit/DoubleTalkSynthesizer.swift \
            Apps/DoubleTalkVoiceExtension/AudioUnitFactory.swift \
            Apps/DoubleTalkVoiceExtension/DoubleTalkAudioUnit.swift \
            -o DoubleTalkVoiceExtensionExec > swiftc_ext_build.log 2>&1 || { cat swiftc_ext_build.log; exit 1; }
          cat swiftc_ext_build.log

      - name: Upload Ext Build Logs on Failure
        if: failure()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          cp swiftc_ext_build.log ext_error.txt
          git add ext_error.txt
          git commit -m "CI: ext_error.txt" || true
          git pull --rebase origin main || true
          git push origin HEAD:main || true

      - name: Package Payload and Create IPA
        run: |
          mkdir -p Payload/DoubleTalkApp.app/PlugIns/DoubleTalkVoiceExtension.appex

          # Assemble Main App bundle
          cp DoubleTalkAppExec Payload/DoubleTalkApp.app/DoubleTalkApp
          chmod +x Payload/DoubleTalkApp.app/DoubleTalkApp
          cp Apps/DoubleTalkApp/Info.plist Payload/DoubleTalkApp.app/Info.plist
          cp doubletalkpc.bin Payload/DoubleTalkApp.app/doubletalkpc.bin
          printf "APPL????" > Payload/DoubleTalkApp.app/PkgInfo

          # Assemble Voice Extension bundle
          cp DoubleTalkVoiceExtensionExec Payload/DoubleTalkApp.app/PlugIns/DoubleTalkVoiceExtension.appex/DoubleTalkVoiceExtension
          chmod +x Payload/DoubleTalkApp.app/PlugIns/DoubleTalkVoiceExtension.appex/DoubleTalkVoiceExtension
          cp Apps/DoubleTalkVoiceExtension/Info.plist Payload/DoubleTalkApp.app/PlugIns/DoubleTalkVoiceExtension.appex/Info.plist
          cp doubletalkpc.bin Payload/DoubleTalkApp.app/PlugIns/DoubleTalkVoiceExtension.appex/doubletalkpc.bin

          # Ad-hoc sign both binaries
          codesign -s - --force --entitlements Apps/DoubleTalkVoiceExtension/DoubleTalkVoiceExtension.entitlements Payload/DoubleTalkApp.app/PlugIns/DoubleTalkVoiceExtension.appex
          codesign -s - --force --entitlements Apps/DoubleTalkApp/DoubleTalkApp.entitlements Payload/DoubleTalkApp.app

          # Zip into .ipa
          zip -r DoubleTalkApp.ipa Payload
          echo "IPA created successfully: DoubleTalkApp.ipa ($(wc -c < DoubleTalkApp.ipa) bytes)"

      - name: Commit IPA to Repository
        run: |
          mkdir -p releases
          cp DoubleTalkApp.ipa releases/DoubleTalkApp.ipa
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          rm -f Sources/CDoubleTalk/*.o Sources/CDoubleTalk/mame/*.o Sources/CDoubleTalk/shim/*.o DoubleTalkAppExec DoubleTalkVoiceExtensionExec
          git pull --rebase
          git add releases/DoubleTalkApp.ipa
          git commit -m "CI: Add compiled DoubleTalkApp.ipa"
          git push origin HEAD:main || true

      - name: Upload IPA Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DoubleTalkApp-iOS-IPA
          path: DoubleTalkApp.ipa
