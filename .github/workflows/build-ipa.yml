name: Build DoubleTalk iOS IPA

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build iOS App & Extension (.ipa)
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify doubletalkpc.bin ROM
        run: |
          if [ ! -f "doubletalkpc.bin" ]; then
            echo "Error: doubletalkpc.bin missing!"
            exit 1
          fi
          echo "doubletalkpc.bin size: $(wc -c < doubletalkpc.bin) bytes"

      - name: Build Xcode Project
        run: |
          xcodebuild \
            -project DoubleTalkApple.xcodeproj \
            -scheme DoubleTalkApp \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package Payload and Create IPA
        run: |
          mkdir -p Payload
          APP_PATH=$(find build -name "DoubleTalkApp.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: DoubleTalkApp.app not found in build directory!"
            exit 1
          fi
          echo "Found compiled app at: $APP_PATH"
          cp -R "$APP_PATH" Payload/
          zip -r DoubleTalkApp.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DoubleTalkApp-iOS-IPA
          path: DoubleTalkApp.ipa
