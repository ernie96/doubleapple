name: Build DoubleTalk iOS IPA

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build iOS App & Extension (.ipa)
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      - name: Verify doubletalkpc.bin ROM
        run: |
          if [ ! -f "doubletalkpc.bin" ]; then
            echo "Error: doubletalkpc.bin missing!"
            exit 1
          fi
          echo "doubletalkpc.bin size: $(wc -c < doubletalkpc.bin) bytes"

      - name: Generate Xcode Project
        run: |
          swift package generate-xcodeproj

      - name: Build Archive & Export IPA
        run: |
          xcodebuild archive \
            -scheme DoubleTalkApp \
            -destination "generic/platform=iOS" \
            -archivePath build/DoubleTalkApp.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

          mkdir -p Payload
          cp -R build/DoubleTalkApp.xcarchive/Products/Applications/DoubleTalkApp.app Payload/
          zip -r DoubleTalkApp.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DoubleTalkApp-iOS-IPA
          path: DoubleTalkApp.ipa
