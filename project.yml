name: DoubleTalk
options:
  bundleIdPrefix: com.doubletalkapple
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    HEADER_SEARCH_PATHS:
      - "$(inherited)"
      - "$(SRCROOT)/Sources/CDoubleTalk/include"
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    AD_HOC_CODE_SIGNING_ALLOWED: YES

targets:
  DoubleTalkKit:
    type: library.static
    platform: iOS
    sources:
      - Sources/CDoubleTalk
      - Sources/DoubleTalkKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.doubletalkapple.kit
        PRODUCT_NAME: DoubleTalkKit
        PRODUCT_MODULE_NAME: DoubleTalkKit
        APPLICATION_EXTENSION_API_ONLY: YES
        DEFINES_MODULE: YES
        HEADER_SEARCH_PATHS:
          - "$(inherited)"
          - "$(SRCROOT)/Sources/CDoubleTalk/include"

  DoubleTalkVoiceExtension:
    type: app-extension
    platform: iOS
    sources:
      - Apps/DoubleTalkVoiceExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.doubletalkapple.app.voiceextension
        APPLICATION_EXTENSION_API_ONLY: YES
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Apps/DoubleTalkVoiceExtension/Info.plist
        PRODUCT_NAME: DoubleTalkVoiceExtension
        TARGETED_DEVICE_FAMILY: "1,2"
        HEADER_SEARCH_PATHS:
          - "$(inherited)"
          - "$(SRCROOT)/Sources/CDoubleTalk/include"
    dependencies:
      - target: DoubleTalkKit

  DoubleTalkApp:
    type: application
    platform: iOS
    sources:
      - Apps/DoubleTalkApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.doubletalkapple.app
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Apps/DoubleTalkApp/Info.plist
        PRODUCT_NAME: DoubleTalk
        INFOPLIST_KEY_CFBundleDisplayName: DoubleTalk
        TARGETED_DEVICE_FAMILY: "1,2"
        HEADER_SEARCH_PATHS:
          - "$(inherited)"
          - "$(SRCROOT)/Sources/CDoubleTalk/include"
    dependencies:
      - target: DoubleTalkKit
      - target: DoubleTalkVoiceExtension
